# O repositório tem dois projetos (server/ e web/) e só o web vai para a
# Netlify — a API e o Postgres ficam no Railway. `base` faz a Netlify entrar
# em web/ antes de instalar e buildar; sem isso ela tentaria buildar a raiz,
# que não tem package.json.
[build]
  base = "web"
  command = "npm run build"
  # Relativo ao `base`, não à raiz do repositório — a doc da Netlify define o
  # publish como "relative to the base directory". Portanto `.next`, e não
  # `web/.next`, que viraria `web/web/.next`.
  #
  # Declarar é obrigatório: sem esta linha o default publica o próprio `base`,
  # ou seja, o código-fonte de web/ sem nenhum index.html — o site sobe e
  # responde 404 em tudo, que foi o que aconteceu no primeiro deploy.
  publish = ".next"

# Declarado à mão de propósito. A Netlify instala este adaptador sozinha
# quando detecta Next.js, mas a detecção do build procura package.json na
# RAIZ do repositório — e a nossa raiz não tem nenhum, só server/ e web/ têm.
# Sem o adaptador, o deploy publica o conteúdo de .next como arquivos
# estáticos: /BUILD_ID responde 200 e toda rota de verdade responde 404.
#
# Sem versão fixada de propósito, seguindo a recomendação do próprio
# adaptador: ele acompanha as versões novas do Next.js a cada build.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Mesma linha do Node que a API usa no Railway. Sem pinar, um upgrade do
  # default da Netlify muda o build sem ninguém pedir.
  NODE_VERSION = "22"
